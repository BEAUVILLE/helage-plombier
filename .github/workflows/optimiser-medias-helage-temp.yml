name: Optimiser medias Helage temporaire
on:
  push:
    paths:
      - '.github/workflows/optimiser-medias-helage-temp.yml'
permissions:
  contents: write
jobs:
  optimiser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer convertisseurs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp libavif-bin
      - name: Rapatrier logo et convertir
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://digiylyfe.net/wp-content/uploads/2026/03/digiylyfe_logo_qr.jpeg' -o digiylyfe-logo-helage.jpg
          test -s digiylyfe-logo-helage.jpg
          cwebp -quiet -q 82 carte-visite.png -o carte-visite.webp
          avifenc --min 28 --max 35 --speed 6 carte-visite.png carte-visite.avif >/dev/null
          cwebp -quiet -q 82 digiylyfe-logo-helage.jpg -o digiylyfe-logo-helage.webp
          avifenc --min 28 --max 35 --speed 6 digiylyfe-logo-helage.jpg digiylyfe-logo-helage.avif >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          for f in ['carte-visite.png','carte-visite.webp','carte-visite.avif','digiylyfe-logo-helage.jpg','digiylyfe-logo-helage.webp','digiylyfe-logo-helage.avif']:
              p=Path(f); print(f'{f}={p.stat().st_size} bytes')
          PY
      - name: Basculer index vers formats legers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_logo='<div class="logo"><img id="logoImg" alt="Logo DIGIYLYFE" src="https://digiylyfe.net/wp-content/uploads/2026/03/digiylyfe_logo_qr.jpeg"></div>'
          new_logo='<div class="logo"><picture><source type="image/avif" srcset="./digiylyfe-logo-helage.avif"><source type="image/webp" srcset="./digiylyfe-logo-helage.webp"><img id="logoImg" alt="Logo DIGIYLYFE" src="./digiylyfe-logo-helage.jpg" decoding="async"></picture></div>'
          old_poster='<div class="poster"><img id="poster" alt="Helage" src="./carte-visite.png?v=20260814-adherent"></div>'
          new_poster='<div class="poster"><picture><source type="image/avif" srcset="./carte-visite.avif"><source type="image/webp" srcset="./carte-visite.webp"><img id="poster" alt="Helage" src="./carte-visite.png?v=20260814-adherent" decoding="async" fetchpriority="high"></picture></div>'
          if old_logo not in s: raise SystemExit('Bloc logo introuvable')
          if old_poster not in s: raise SystemExit('Bloc poster introuvable')
          s=s.replace(old_logo,new_logo,1).replace(old_poster,new_poster,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publier et nettoyer
        run: |
          set -euo pipefail
          rm -f .github/workflows/optimiser-medias-helage-temp.yml
          git config user.name 'DIGIYLYFE Media Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html carte-visite.webp carte-visite.avif digiylyfe-logo-helage.jpg digiylyfe-logo-helage.webp digiylyfe-logo-helage.avif .github/workflows/optimiser-medias-helage-temp.yml
          if git diff --cached --quiet; then echo 'Aucun changement'; exit 0; fi
          git commit -m 'Media: optimiser Helage Plombier'
          git push origin main
