name: Temporary Helage adherent fix

on:
  push:
    branches: [tmp-adherent-fix-20260814]
    paths:
      - '.github/workflows/tmp-adherent-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-adherent-fix-20260814
          fetch-depth: 0
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Build local card and neutralize wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          from PIL import Image, ImageDraw, ImageFont
          import io

          remote='https://digiylyfe.net/wp-content/uploads/2026/05/ChatGPT-Image-14-mai-2026-04_01_44.png'
          data=urlopen(remote,timeout=30).read()
          im=Image.open(io.BytesIO(data)).convert('RGB')
          w,h=im.size
          d=ImageDraw.Draw(im)
          font_path='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'

          # Membership badge high on the card, away from the QR zone.
          x1,x2=int(w*.10),int(w*.90)
          y1,y2=int(h*.045),int(h*.105)
          d.rounded_rectangle((x1,y1,x2,y2),radius=max(12,int(h*.018)),fill=(7,55,39),outline=(226,174,43),width=max(2,w//420))
          text='ADHÉRENT DIGIYLYFE'
          size=max(20,int(h*.028))
          while size>14:
              f=ImageFont.truetype(font_path,size)
              b=d.textbbox((0,0),text,font=f)
              if b[2]-b[0] <= (x2-x1)-50: break
              size-=1
          tw,th=b[2]-b[0],b[3]-b[1]
          d.text(((w-tw)/2,y1+(y2-y1-th)/2-2),text,font=f,fill=(244,199,77))

          # Permanent DIGIYLYFE.COM signature at the very bottom.
          sig='DIGIYLYFE.COM'
          size=max(16,int(h*.018))
          sf=ImageFont.truetype(font_path,size)
          sb=d.textbbox((0,0),sig,font=sf)
          sw,sh=sb[2]-sb[0],sb[3]-sb[1]
          py=int(h*.012)
          d.rounded_rectangle((int(w*.26),h-sh-py*2-8,int(w*.74),h-8),radius=max(8,int(h*.009)),fill=(7,55,39),outline=(226,174,43),width=max(2,w//500))
          d.text(((w-sw)/2,h-sh-py-8),sig,font=sf,fill=(244,199,77))
          im.save('carte-visite.png','PNG',optimize=True)

          q=Path('index.html')
          s=q.read_text(encoding='utf-8')
          s=s.replace(remote,'./carte-visite.png?v=20260814-adherent')
          reps={
            '/* ===== EMPREINTE OFFICIELLE DIGIY ===== */':'/* ===== EMPREINTE DIGIYLYFE ===== */',
            'aria-label="Empreinte officielle DIGIYLYFE"':'aria-label="Empreinte DIGIYLYFE"',
            '>QR officiel DIGIY<':'>QR DIGIY<',
            '>Marque mère officielle<':'>ADHÉRENT DIGIYLYFE<',
            '>▣ QR officiel DIGIYLYFE<':'>▣ ADHÉRENT DIGIYLYFE<',
            '>📲 QR officiel DIGIYLYFE<':'>📲 QR DIGIYLYFE<',
            '>Scanne la fiche officielle<':'>Scanne la fiche DIGIYLYFE<',
            'Ce QR ouvre directement la fiche officielle Helage':'Ce QR ouvre directement la fiche DIGIYLYFE de Helage',
            'DIGIY BUILD • fiche publique officielle':'DIGIY BUILD • fiche publique · ADHÉRENT DIGIYLYFE',
            'DIGIYLYFE.COM · Maison mère officielle':'DIGIYLYFE.COM · Helage adhérent',
            'je viens de votre fiche officielle DIGIYLYFE':'je viens de votre fiche DIGIYLYFE',
            'QR officiel DIGIYLYFE':'QR DIGIYLYFE',
            'Marque mère officielle':'ADHÉRENT DIGIYLYFE',
            'Maison mère officielle':'DIGIYLYFE.COM',
            'fiche officielle Helage':'fiche DIGIYLYFE de Helage',
            'fiche officielle DIGIYLYFE':'fiche DIGIYLYFE',
            'fiche officielle':'fiche DIGIYLYFE',
            'fiche publique officielle':'fiche publique',
            'Official DIGIY QR':'DIGIY QR',
            'Official DIGIYLYFE QR':'DIGIYLYFE QR',
            'Official mother brand':'DIGIYLYFE MEMBER',
            'official DIGIYLYFE profile':'DIGIYLYFE profile',
            'official profile':'DIGIYLYFE profile',
            'QR oficial DIGIY':'QR DIGIY',
            'QR oficial DIGIYLYFE':'QR DIGIYLYFE',
            'Marca matriz oficial':'MIEMBRO DIGIYLYFE',
            'ficha oficial DIGIYLYFE':'ficha DIGIYLYFE',
            'ficha oficial':'ficha DIGIYLYFE',
            'Offizieller DIGIY-QR':'DIGIY-QR',
            'Offizieller DIGIYLYFE-QR':'DIGIYLYFE-QR',
            'Offizielle Dachmarke':'DIGIYLYFE-MITGLIED',
            'Offizielles Profil':'DIGIYLYFE-Profil',
            'offizielles DIGIYLYFE-Profil':'DIGIYLYFE-Profil',
            'QR ufficiale DIGIY':'QR DIGIY',
            'QR ufficiale DIGIYLYFE':'QR DIGIYLYFE',
            'Marchio madre ufficiale':'ADERENTE DIGIYLYFE',
            'scheda ufficiale DIGIYLYFE':'scheda DIGIYLYFE',
            'scheda ufficiale':'scheda DIGIYLYFE',
            'Officiële DIGIY-QR':'DIGIY-QR',
            'Officiële DIGIYLYFE-QR':'DIGIYLYFE-QR',
            'Officieel moedermerk':'DIGIYLYFE-LID',
            'officieel DIGIYLYFE-profiel':'DIGIYLYFE-profiel',
            'officiële DIGIYLYFE-profiel':'DIGIYLYFE-profiel',
            'رمز DIGIY رسمي':'رمز DIGIY',
            'رمز QR رسمي من DIGIYLYFE':'رمز QR من DIGIYLYFE',
            'العلامة الأم الرسمية':'عضو DIGIYLYFE',
            'الملف الرسمي':'ملف DIGIYLYFE',
            'ملف DIGIYLYFE رسمي':'ملف DIGIYLYFE',
            'ملفك الرسمي على DIGIYLYFE':'ملفك على DIGIYLYFE'
          }
          for a,b in reps.items():
              s=s.replace(a,b)

          # Make the visible status unambiguous in the main French block and translated label fields.
          s=s.replace('official_qr_badge:"▣ QR DIGIYLYFE"','official_qr_badge:"▣ ADHÉRENT DIGIYLYFE"')
          s=s.replace('official_qr_badge:"▣ DIGIYLYFE QR"','official_qr_badge:"▣ DIGIYLYFE MEMBER"')
          s=s.replace('official_qr_badge:"▣ QR DIGIYLYFE"','official_qr_badge:"▣ MIEMBRO DIGIYLYFE"',1)
          q.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          test -s carte-visite.png
          grep -q 'carte-visite.png?v=20260814-adherent' index.html
          grep -q 'ADHÉRENT DIGIYLYFE' index.html
          ! grep -qi 'fiche officielle' index.html
          ! grep -qi 'QR officiel' index.html
      - name: Commit temp result
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html carte-visite.png
          git commit -m 'Helage : adhérent DIGIYLYFE et carte locale'
          git push origin HEAD:tmp-adherent-fix-20260814
