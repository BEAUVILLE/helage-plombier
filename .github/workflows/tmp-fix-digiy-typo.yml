name: Temporary Helage DIGIY typo fix

on:
  push:
    branches: [fix-helage-digiy-typo-20260814]
    paths:
      - '.github/workflows/tmp-fix-digiy-typo.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-helage-digiy-typo-20260814
          fetch-depth: 0
      - name: Fix duplicated Y
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('DIGIYYLYFE','DIGIYLYFE').replace('DIGIYY','DIGIY')
          p.write_text(s,encoding='utf-8')
          PY
          ! grep -q 'DIGIYY' index.html
          grep -q 'ADHÉRENT DIGIYLYFE' index.html
      - name: Commit index only
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Helage : corriger libellés DIGIY'
          git push origin HEAD:fix-helage-digiy-typo-20260814
